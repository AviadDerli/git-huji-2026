<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sheep App 🚶‍♀️🚶‍♀️🚶‍♀️🚶‍♀️🚶‍♀️🚶‍♀️</title>
</head>

<body>
    <h1>Welcome to my site 🐑🐏</h1>
    <h5>This is a simple App page.</h5>
    <hr>
    <div id="app">
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Breed</th>
                </tr>
            </thead>
            <tbody>
                <tr v-for="sheep in sheepList" :key="sheep.id">
                    <td>{{ sheep.name }}</td>
                    <td>{{ sheep.age }}</td>
                    <td>{{ sheep.breed }}</td>
                </tr>
            </tbody>
    </div>
</body>

</html>
